name: Migrate prod DB

# Applique les migrations Supabase sur la base `etale-prod` à chaque merge sur
# `main` qui touche `packages/db/supabase/migrations/`. Avant ce workflow, les
# migrations étaient poussées à la main (`supabase db push`) et l'une d'elles
# n'a jamais atteint la prod.
#
# Vercel déploie `main` EN PARALLÈLE de ce workflow : rien ne garantit que la
# migration passe avant le nouveau code. Règle (CLAUDE.md) : une migration doit
# rester compatible avec le code déjà en ligne — ajouter avant d'utiliser,
# retirer après.
#
# Pas de trigger `pull_request` : ce repo est public, les secrets ne doivent pas
# être exposés à un déclencheur venant d'une PR (même règle que backup-prod.yml).
on:
  push:
    branches: [main]
    paths:
      - "packages/db/supabase/migrations/**"
  workflow_dispatch:

# Une seule migration à la fois, et jamais annulée en cours de route : un
# `db push` interrompu laisserait la base dans un état intermédiaire.
concurrency:
  group: migrate-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/db
    env:
      PROJECT_REF: oqtwgsitnylmvjadvrkt
      # Lus directement par le CLI Supabase (link + db push).
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Même version que le CLI local : évite un écart de comportement entre ce
      # qui a été testé en dev et ce qui tourne sur la prod.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Vérifier les secrets
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Le secret SUPABASE_ACCESS_TOKEN est vide ou absent."
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Le secret SUPABASE_DB_PASSWORD est vide ou absent."
            exit 1
          fi

      # `link` passe par le pooler par défaut (IPv4) : la connexion directe
      # Supabase est IPv6-only et échoue depuis un runner GitHub Actions.
      - name: Lier le projet etale-prod
        run: supabase link --project-ref "$PROJECT_REF"

      # Trace dans les logs de ce qui va être appliqué, avant d'y toucher.
      - name: Migrations en attente (dry-run)
        run: supabase db push --linked --dry-run

      - name: Appliquer les migrations
        run: supabase db push --linked
